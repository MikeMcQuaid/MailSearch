name: MailSearch
options:
  bundleIdPrefix: com.mikemcquaid
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
packages:
  MailSearchPackage:
    path: .
settings:
  base:
    ARCHS: arm64
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SUPPRESS_WARNINGS: NO
    SWIFT_SUPPRESS_WARNINGS: NO
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_MEMORY_SAFETY: YES
    OTHER_SWIFT_FLAGS: $(inherited) -warn-implicit-overrides
    OTHER_LDFLAGS: $(inherited) -Wl,-fatal_warnings
    RUN_CLANG_STATIC_ANALYZER: YES
    CLANG_STATIC_ANALYZER_MODE: deep
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ANALYZER_OSOBJECT_C_STYLE_CAST: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_LOCALIZABILITY_EMPTY_CONTEXT: YES
    CLANG_ANALYZER_GCD_PERFORMANCE: YES
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_ANALYZER_SECURITY_BUFFER_OVERFLOW_EXPERIMENTAL: YES
targets:
  MailSearchApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Icons/**
          - Info.plist
          - MailSearch.entitlements
      - path: App/Icons/AppIcon.icon
        type: file
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.txt
        buildPhase: resources
    dependencies:
      - package: MailSearchPackage
        product: MailSearchFeatures
      - package: MailSearchPackage
        product: MailSearchData
      - package: MailSearchPackage
        product: MailSearchDomain
    configFiles:
      Debug: .build/version.xcconfig
      Release: .build/version.xcconfig
    scheme:
      preActions:
        - name: Set version from Git
          settingsTarget: MailSearchApp
          script: |
            "${PROJECT_DIR}/script/version" --xcconfig "${PROJECT_DIR}/.build/version.xcconfig"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.MailSearch
        PRODUCT_NAME: MailSearch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/MailSearch.entitlements
        ENABLE_HARDENED_RUNTIME: YES
