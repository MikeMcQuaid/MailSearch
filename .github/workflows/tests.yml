name: GitHub Actions CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: false
          cask: false

      - name: Bootstrap
        run: script/bootstrap

      - name: Check style
        run: script/style

  tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/checkouts
            .build/repositories
            .build/upstream
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved', 'vendor/SwiftMail/upstream.json') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Bootstrap
        run: script/bootstrap

      - name: Build
        run: script/build

      - name: Zip
        run: script/zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MailSearch
          path: .build/MailSearch-*.zip
          # The zip lives in a hidden directory, skipped by default.
          include-hidden-files: true
          if-no-files-found: error

      - name: Test
        id: test
        run: |
          failed=0
          for target in MailSearchDomainTests MailSearchDataTests MailSearchFeaturesTests; do
            bash script/test --test-product "${target}" --xunit-output ".build/test-${target}.xml" \
              2>&1 | tee ".build/test-${target}.log" || failed=1
          done
          exit "${failed}"

      - name: Test with Address Sanitizer
        id: address_sanitizer
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          ASAN_OPTIONS: halt_on_error=1:log_path=${{ github.workspace }}/.build/asan-runtime
        run: |
          # SwiftSoup exhausts the worker stack in Debug + ASan; see vendor/README.md.
          # Each target needs its own report; later targets can overwrite it.
          failed=0
          for target in MailSearchDomainTests MailSearchDataTests MailSearchFeaturesTests; do
            bash script/test --sanitize address --scratch-path .build/address-sanitizer --configuration release \
              --test-product "${target}" --xunit-output ".build/asan-${target}.xml" 2>&1 | tee ".build/asan-${target}.log" || failed=1
          done
          exit "${failed}"

      - name: Test with Thread Sanitizer
        id: thread_sanitizer
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          TSAN_OPTIONS: halt_on_error=1:log_path=${{ github.workspace }}/.build/tsan-runtime
        run: |
          failed=0
          for target in MailSearchDomainTests MailSearchDataTests MailSearchFeaturesTests; do
            bash script/test --sanitize thread --scratch-path .build/thread-sanitizer --test-product "${target}" \
              --xunit-output ".build/tsan-${target}.xml" 2>&1 | tee ".build/tsan-${target}.log" || failed=1
          done
          exit "${failed}"

      - name: Upload test diagnostics
        if: >-
          failure() && (steps.test.outcome == 'failure' ||
          steps.address_sanitizer.outcome == 'failure' || steps.thread_sanitizer.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          path: |
            .build/test-*
            .build/asan-*
            .build/tsan-*
          include-hidden-files: true
          if-no-files-found: error

  analyze:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/checkouts
            .build/repositories
            .build/upstream
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved', 'vendor/SwiftMail/upstream.json') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Bootstrap
        run: script/bootstrap

      - name: Analyze
        run: script/analyze

      - name: Upload analysis diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-diagnostics
          path: |
            .build/analyze-*.log
            .build/analyze-package.json
          include-hidden-files: true
          if-no-files-found: error

# `style`, `tests` and `analyze` always run, so they are the required
# checks in branch protection directly. If any job ever becomes
# conditionally skipped (a job-level `if:`, a path filter, or a
# matrix), add back an aggregating `check` job with `if: always()`
# that fails unless every `needs` job succeeded and require that
# instead: branch protection handles a skipped required-by-name check
# poorly.
